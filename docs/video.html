<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels 影片檢測 — 上傳影片找出需優化的字詞</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --text: #1c1c1e; --muted: #6b6b70;
    --border: #e3e3e6; --accent: #405de6;
    --pass: #1a7f37; --review: #9a6700; --reach: #bc4c00; --violation: #cf222e;
    --pass-bg: #dafbe1; --review-bg: #fff8c5; --reach-bg: #fff1e5; --violation-bg: #ffebe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101014; --card: #1b1b21; --text: #ececf0; --muted: #9a9aa2;
      --border: #2e2e36; --accent: #8b9cf7;
      --pass: #4ade80; --review: #facc15; --reach: #fb923c; --violation: #f87171;
      --pass-bg: #12261a; --review-bg: #29230d; --reach-bg: #2b1c10; --violation-bg: #2b1416;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .nav { font-size: .85rem; margin-bottom: 16px; }
  .nav a { color: var(--accent); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  .hint { font-weight: 400; color: var(--muted); }
  textarea, select, input[type=file] {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); padding: 10px 12px; font: inherit;
  }
  textarea { resize: vertical; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  button {
    margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 12px; font-size: .9rem; color: var(--muted); white-space: pre-line; }
  progress { width: 100%; height: 8px; margin-top: 6px; accent-color: var(--accent); }
  .verdict {
    border-radius: 12px; padding: 14px 16px; font-weight: 700;
    margin-bottom: 16px; border: 1px solid var(--border);
  }
  .verdict.pass { color: var(--pass); background: var(--pass-bg); }
  .verdict.review { color: var(--review); background: var(--review-bg); }
  .verdict.reach_risk { color: var(--reach); background: var(--reach-bg); }
  .verdict.violation_risk { color: var(--violation); background: var(--violation-bg); }
  .score { font-weight: 400; font-size: .9rem; opacity: .85; }
  .finding { border-top: 1px solid var(--border); padding: 12px 0; }
  .finding:first-child { border-top: 0; padding-top: 0; }
  .time {
    display: inline-block; font-weight: 700; font-family: ui-monospace, monospace;
    color: var(--accent); cursor: pointer; text-decoration: underline;
  }
  .badge {
    display: inline-block; font-size: .75rem; font-weight: 700;
    border-radius: 999px; padding: 1px 10px; margin: 0 6px; vertical-align: 1px;
  }
  .badge.removal { color: var(--violation); background: var(--violation-bg); }
  .badge.reach { color: var(--reach); background: var(--reach-bg); }
  .badge.quality { color: var(--muted); background: var(--bg); }
  .finding .msg { font-weight: 600; margin-top: 2px; }
  .finding .quote { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .finding .quote mark { background: var(--review-bg); color: inherit; font-weight: 700; border-radius: 3px; padding: 0 2px; }
  .finding .fix { font-size: .9rem; margin-top: 4px; }
  .finding .fix::before { content: "建議："; font-weight: 700; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  #player { width: 100%; border-radius: 8px; margin-top: 8px; display: none; background: #000; }
  #transcript { font-size: .9rem; }
  #transcript .seg { padding: 2px 0; }
  #transcript .seg .t { color: var(--muted); font-family: ui-monospace, monospace; margin-right: 8px; cursor: pointer; }
  #transcript .seg.hit { background: var(--review-bg); border-radius: 6px; padding: 2px 6px; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
  footer a { color: var(--accent); }
  #results { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Reels 影片檢測</h1>
  <p class="sub">上傳影片，自動轉出口白逐字稿並標出<b>幾分幾秒</b>出現需要優化的字詞。
  語音辨識與檢測全部在你的瀏覽器本地執行（第一次使用需下載辨識模型），影片不會上傳到任何伺服器。</p>
  <p class="nav">📝 只想貼文字檢查？<a href="index.html">用文字版</a></p>

  <div class="card">
    <label for="file">影片或音訊檔 <span class="hint">（mp4 / mov / mp3 / wav…，取音軌分析）</span></label>
    <input type="file" id="file" accept="video/*,audio/*">
    <video id="player" controls preload="metadata"></video>

    <div class="row">
      <div>
        <label for="model">辨識模型</label>
        <select id="model">
          <option value="Xenova/whisper-base" selected>base — 建議（約 80MB）</option>
          <option value="Xenova/whisper-tiny">tiny — 最快，準度較低（約 40MB）</option>
          <option value="Xenova/whisper-small">small — 較準，較慢（約 250MB）</option>
        </select>
      </div>
      <div>
        <label for="lang">影片語言</label>
        <select id="lang">
          <option value="chinese" selected>中文</option>
          <option value="english">English</option>
          <option value="auto">自動偵測</option>
        </select>
      </div>
    </div>

    <label for="caption">貼文文案 <span class="hint">（選填，一併檢查）</span></label>
    <textarea id="caption" rows="3" placeholder="要搭配這支影片的文案與 #hashtag"></textarea>

    <button id="run" disabled>分析影片</button>
    <div id="status">正在載入頁面資源…</div>
    <progress id="bar" max="100" value="0" style="display:none"></progress>
  </div>

  <div id="results">
    <div id="verdict" class="verdict"></div>

    <div class="card">
      <h2>⏱️ 需優化的字詞（依時間排序）</h2>
      <div id="findings"></div>
    </div>

    <div class="card">
      <h2>逐字稿 <span class="hint">（黃底 = 該段有命中，點時間可跳轉播放）</span></h2>
      <div id="transcript"></div>
    </div>

    <div class="card">
      <h2>發佈前人工檢查清單 <span class="hint">（語音掃不到的部分）</span></h2>
      <ul class="checklist" id="checklist" style="list-style:none;padding-left:0;margin:0"></ul>
    </div>
  </div>

  <footer>
    ⚠️ 語音辨識會有錯字與時間誤差（模型越大越準），檢測結果僅供發佈前自我檢查參考，
    通過不代表保證不被限流。
    原始碼：<a href="https://github.com/DomingoSun/Instagram-Detector" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>

<script src="detector.js"></script>
<script type="module">
  const statusEl = document.getElementById("status");
  const barEl = document.getElementById("bar");
  const runBtn = document.getElementById("run");
  const fileEl = document.getElementById("file");
  const player = document.getElementById("player");

  const VERDICT_LABEL = {
    pass: "✅ 通過 — 口白與文案未發現政策問題",
    review: "🔍 建議調整 — 有小問題但風險低",
    reach_risk: "⚠️ 限流風險 — 內容可能不被推薦、觸及下降",
    violation_risk: "🚫 違規風險 — 可能被下架或影響帳號",
  };
  const SEV_LABEL = { low: "低", medium: "中", high: "高", critical: "嚴重" };
  const CONS_LABEL = { removal: "下架/帳號處分", reach: "限流", quality: "最佳實務" };

  for (const item of MANUAL_CHECKLIST) {
    const li = document.createElement("li");
    li.textContent = "☐ " + item;
    document.getElementById("checklist").appendChild(li);
  }

  function setStatus(text, pct) {
    statusEl.textContent = text;
    if (pct == null) { barEl.style.display = "none"; }
    else { barEl.style.display = "block"; barEl.value = pct; }
  }

  let transformers;
  try {
    transformers = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
    transformers.env.allowLocalModels = false;
    setStatus("就緒。選擇影片後按「分析影片」。");
  } catch (e) {
    setStatus("❌ 無法載入語音辨識函式庫（需要網路連線）：" + e.message);
  }

  fileEl.addEventListener("change", () => {
    runBtn.disabled = !fileEl.files.length || !transformers;
    if (fileEl.files.length) {
      player.src = URL.createObjectURL(fileEl.files[0]);
      player.style.display = "block";
    }
  });

  async function decodeToMono16k(file) {
    const buf = await file.arrayBuffer();
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    try {
      const audio = await ctx.decodeAudioData(buf);
      const ch0 = audio.getChannelData(0);
      if (audio.numberOfChannels === 1) return Float32Array.from(ch0);
      const ch1 = audio.getChannelData(1);
      const mono = new Float32Array(ch0.length);
      for (let i = 0; i < ch0.length; i++) mono[i] = (ch0[i] + ch1[i]) / 2;
      return mono;
    } finally {
      ctx.close();
    }
  }

  let transcriber = null;
  let loadedModel = "";

  async function getTranscriber(modelId) {
    if (transcriber && loadedModel === modelId) return transcriber;
    transcriber = await transformers.pipeline("automatic-speech-recognition", modelId, {
      progress_callback: (p) => {
        if (p.status === "progress" && p.file) {
          setStatus(`下載辨識模型（只需一次，之後會快取）\n${p.file}`, p.progress ?? 0);
        }
      },
    });
    loadedModel = modelId;
    return transcriber;
  }

  runBtn.addEventListener("click", async () => {
    const file = fileEl.files[0];
    if (!file) return;
    runBtn.disabled = true;
    document.getElementById("results").style.display = "none";
    try {
      setStatus("解析音軌中…");
      const audio = await decodeToMono16k(file);
      const durationMin = audio.length / 16000 / 60;

      const asr = await getTranscriber(document.getElementById("model").value);

      setStatus(`辨識中（約 ${durationMin.toFixed(1)} 分鐘音訊，依裝置效能需要一點時間）…`);
      const lang = document.getElementById("lang").value;
      const opts = {
        chunk_length_s: 30,
        stride_length_s: 5,
        return_timestamps: true,
        task: "transcribe",
      };
      if (lang !== "auto") opts.language = lang;
      const output = await asr(audio, opts);

      const segments = (output.chunks || []).map((c) => ({
        start: c.timestamp?.[0],
        end: c.timestamp?.[1],
        text: c.text || "",
      })).filter((s) => s.text.trim());

      render(segments, output.text || "");
      setStatus("完成 ✔");
    } catch (e) {
      console.error(e);
      setStatus("❌ 分析失敗：" + (e?.message || e) +
        "\n（若是音軌解析失敗，請試著先把影片轉成 mp4/H.264+AAC 或直接上傳 mp3/wav）");
    } finally {
      runBtn.disabled = false;
    }
  });

  function render(segments, fullText) {
    const caption = document.getElementById("caption").value;
    const findings = analyzeSegments(segments);
    const overall = analyze({
      caption: zhNormalize(caption),
      transcript: zhNormalize(fullText),
    });

    const verdictEl = document.getElementById("verdict");
    verdictEl.className = "verdict " + overall.verdict;
    verdictEl.textContent = VERDICT_LABEL[overall.verdict];
    const score = document.createElement("div");
    score.className = "score";
    score.textContent = `風險分數 ${overall.risk_score}/100（口白＋文案整體評估）`;
    verdictEl.appendChild(score);

    // 時間軸命中
    const findEl = document.getElementById("findings");
    findEl.innerHTML = "";
    if (!findings.length) {
      const p = document.createElement("p");
      p.textContent = segments.length
        ? "口白中未發現需要優化的字詞。"
        : "沒有辨識出可分析的口白（影片可能沒有人聲，或語言選擇不符）。";
      findEl.appendChild(p);
    }
    for (const f of findings) {
      const div = document.createElement("div");
      div.className = "finding";

      const head = document.createElement("div");
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = f.time;
      time.title = "點擊跳到這個時間";
      time.addEventListener("click", () => { player.currentTime = f.start ?? 0; player.play(); });
      const badge = document.createElement("span");
      badge.className = "badge " + f.consequence;
      badge.textContent = `${SEV_LABEL[f.severity]}｜${CONS_LABEL[f.consequence]}`;
      head.append(time, badge, `命中字詞：「${f.match}」`);

      const msg = document.createElement("div");
      msg.className = "msg";
      msg.textContent = f.message;

      const quote = document.createElement("div");
      quote.className = "quote";
      quote.append("該段口白：");
      const idx = f.segment_text.indexOf(f.match);
      if (idx >= 0) {
        quote.append(f.segment_text.slice(0, idx));
        const mark = document.createElement("mark");
        mark.textContent = f.match;
        quote.append(mark, f.segment_text.slice(idx + f.match.length));
      } else {
        quote.append(f.segment_text);
      }

      const fix = document.createElement("div");
      fix.className = "fix";
      fix.textContent = f.suggestion;

      div.append(head, msg, quote, fix);
      findEl.appendChild(div);
    }

    // 文案問題（無時間戳，另外列出）
    const captionDets = overall.detections.filter((d) => d.field !== "audio_transcript");
    for (const d of captionDets) {
      const div = document.createElement("div");
      div.className = "finding";
      const head = document.createElement("div");
      const badge = document.createElement("span");
      badge.className = "badge " + d.consequence;
      badge.textContent = `${SEV_LABEL[d.severity]}｜${CONS_LABEL[d.consequence]}`;
      head.append("📝 文案", badge, d.message);
      const quote = document.createElement("div");
      quote.className = "quote";
      quote.textContent = `證據：「${d.evidence}」`;
      const fix = document.createElement("div");
      fix.className = "fix";
      fix.textContent = d.suggestion;
      div.append(head, quote, fix);
      findEl.appendChild(div);
    }

    // 逐字稿
    const hitStarts = new Set(findings.map((f) => f.start));
    const trEl = document.getElementById("transcript");
    trEl.innerHTML = "";
    if (!segments.length) {
      trEl.textContent = "（無逐字稿）";
    }
    for (const seg of segments) {
      const div = document.createElement("div");
      div.className = "seg" + (hitStarts.has(seg.start) ? " hit" : "");
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = formatTime(seg.start);
      t.addEventListener("click", () => { player.currentTime = seg.start ?? 0; player.play(); });
      div.append(t, zhNormalize(seg.text.trim()));
      trEl.appendChild(div);
    }

    document.getElementById("results").style.display = "block";
    verdictEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // 供自動化測試使用（模擬辨識輸出直接渲染）
  window.__test = { render, decodeToMono16k };
</script>
</body>
</html>
